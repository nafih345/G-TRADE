# Render Blueprint — the backend web service, written down so it is reproducible.
#
# The database is deliberately NOT declared here. Render's free Postgres is deleted 30 days
# after creation, and that is not a hypothetical: instance `dpg-da23a7j7uimc73dpqo70-a`
# expired, was removed, and the service kept serving with a dead database handle for weeks —
# every API request returning 500 while the frontend rendered calm, empty screens. Declaring
# a `databases:` block here would put that timer back.
#
# Instead the database lives on Neon (free, and not time-limited), and DATABASE_URL is set
# by hand on the service. backend/config/settings.py already handles a Neon URL correctly:
# it detects the dotted public hostname and requires TLS, and it prefers
# POSTGRES_URL_NON_POOLING when Neon injects one so boot-time `migrate` runs on a direct
# connection.
#
# The service name below matches the service that already exists and the hostname the
# deployed frontend calls (see vercel.json's /api rewrite and
# frontend/src/utils/backendStatus.js's DEFAULT_DEPLOYED_API_URL). Keep all three in step.
# If you apply this Blueprint while a hand-made service of the same name exists, Render will
# create a second one rather than adopt it — delete the old service first, or just mirror
# these settings onto it by hand.

services:
  - type: web
    name: g-trade-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # `bash ./build.sh` rather than `./build.sh` — the repo is authored on Windows, where
    # git does not track the executable bit, so the script would not be runnable directly.
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      # Set these in the Render dashboard (sync:false = never committed).
      #
      # DATABASE_URL — the Neon connection string, e.g.
      #   postgresql://user:pass@ep-xxxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      # An explicit sslmode= in the URL wins over settings.py's own TLS decision, so keeping
      # Neon's `?sslmode=require` on the end is both correct and self-documenting.
      - key: DATABASE_URL
        sync: false
      # build.sh's `bootstrap_admin` creates this login on the fresh, empty database —
      # without it there is no way to sign in to a brand-new database at all.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Comma-separated https origins of the Vercel frontend, e.g.
      # https://g-trade-pi.vercel.app — used for CSRF_TRUSTED_ORIGINS, which Django admin
      # login over HTTPS refuses to work without once DEBUG=False.
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Without this the backend runs with DEBUG=True in production — Render does not set
      # $VERCEL, which is what settings.py previously used to infer "am I deployed?".
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.5"
      # build.sh already runs `migrate`. Keep the boot-time hook on as a safety net for the
      # case where a release ships code ahead of the schema.
      - key: AUTO_MIGRATE
        value: "True"
