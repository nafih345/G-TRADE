<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting Optical ERP...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 12px;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
    }
    .brand-icon svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .progress-wrapper {
      width: 280px;
      height: 6px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      position: absolute;
      animation: loading 1.8s infinite ease-in-out;
    }
    @keyframes loading {
      0% { left: -40%; width: 40%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }
    .footer {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="brand-icon">
      <!-- Glasses / Optical Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
    </div>
  </div>
  <h1 class="title">Optical ERP</h1>
  <p class="subtitle">Commercial Desktop Enterprise</p>
  
  <div class="progress-wrapper">
    <div class="progress-bar"></div>
  </div>
  
  <p class="status-text" id="status">Initializing Backend & Database Engines...</p>
  
  <div class="footer">Version 1.0.0 &bull; Licensed Enterprise Software</div>

  <script>
    const { ipcRenderer } = require('electron');
    if (ipcRenderer) {
      ipcRenderer.on('status-update', (event, message) => {
        document.getElementById('status').innerText = message;
      });
    }
  </script>
</body>
</html>
